name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e .
      - name: Check bytecode compilation
        run: python -m compileall -q src skills tests
      - name: Run unit test suite
        run: python -m unittest discover -s tests -v
      - name: Smoke test CLI and standalone skill script
        run: |
          uncutoff --version
          uncutoff rules --format json > rules.json
          python skills/uncutoff/scripts/uncutoff_cli.py --version
